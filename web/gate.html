<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless — daily gate</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="overlay">
    <div class="panel card">
      <p class="shell-kicker">Daily gate</p>
      <h1 class="shell-title">Lock a plan</h1>
      <p class="shell-lead">Today stays locked until this day's plan is saved. You can also set a day ahead.</p>
      <div class="card-head shell-section">
        <label class="compact-label" for="plan-day">Day</label>
        <input type="date" id="plan-day" class="inline-date" />
      </div>
      <label class="compact-label" for="outcomes">What done means</label>
      <textarea id="outcomes" class="compact-area" rows="3" placeholder="In plain words, what finished looks like" autofocus></textarea>
      <div class="shell-section">
        <p class="shell-section-head">Time blocks</p>
        <p class="sub" style="margin:0 0 0.45rem">Drag the clock hands like an alarm. Inner ring is the hour, outer ring is the minute.</p>
        <div id="blocks"></div>
      </div>
      <div class="plan-actions">
        <button type="button" class="ghost" id="add-block">+ Block</button>
        <button type="button" id="lock">Lock plan</button>
      </div>
      <p class="miss" id="err"></p>
    </div>
  </div>
  <script src="/static/summary.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/clock.js"></script>
  <script>
    let today = "";
    function blockEl(start, end, task) {
      const wrap = document.createElement("div");
      wrap.className = "block-row block-analog";
      wrap.innerHTML = `<div><label>Start</label><div data-start></div></div>
        <div><label>End</label><div data-end></div></div>
        <input class="task" placeholder="What you'll do" value="${(task || "").replace(/"/g, "&quot;")}" />`;
      wrap._start = AnalogClock(wrap.querySelector("[data-start]"), { value: start || "09:00" });
      wrap._end = AnalogClock(wrap.querySelector("[data-end]"), { value: end || "10:00" });
      return wrap;
    }
    function addBlock(start, end, task) {
      el("blocks").appendChild(blockEl(start, end, task));
    }
    async function loadDay(day) {
      const p = await api("/api/plan?day=" + encodeURIComponent(day));
      el("outcomes").value = p.outcomes || "";
      el("blocks").innerHTML = "";
      const tl = p.timeline || [];
      if (tl.length) tl.forEach((b) => addBlock(b.start, b.end, b.task));
      else addBlock("09:00", "10:00", "");
    }
    el("add-block").onclick = () => addBlock("09:00", "10:00", "");
    el("plan-day").onchange = () => loadDay(el("plan-day").value);
    el("lock").onclick = async () => {
      el("err").textContent = "";
      const day = el("plan-day").value;
      const outcomes = el("outcomes").value;
      const timeline = [...el("blocks").children].map((row) => ({
        start: row._start.value(),
        end: row._end.value(),
        task: row.querySelector(".task").value,
      })).filter((b) => b.task.trim());
      try {
        await api("/api/plan", { method: "POST", body: JSON.stringify({ outcomes, timeline, day }) });
        if (day === today) location.href = "/";
        else el("err").textContent = "Saved for " + day + ". Today still needs a plan before the desk unlocks.";
        if (window.UI) UI.toast("Plan saved for " + day + ".", "mint");
      } catch (e) {
        el("err").textContent = e.message;
      }
    };
    (async () => {
      const t = await api("/api/today");
      if (t.halt) { location.href = "/halt"; return; }
      if (t.needs_recap) { location.href = "/recap"; return; }
      today = t.day;
      el("plan-day").value = t.day;
      el("plan-day").min = t.day;
      await loadDay(t.day);
    })().catch((err) => { el("err").textContent = err.message; });
  </script>
</body>
</html>
