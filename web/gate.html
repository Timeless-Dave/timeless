<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless — daily gate</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="gate-page">
  <div class="overlay">
    <div class="panel card">
      <p class="shell-kicker">Daily gate</p>
      <h1 class="shell-title">Lock a plan</h1>
      <p class="shell-lead">Today stays locked until this day's plan is saved. You can also set a day ahead.</p>
      <div class="card-head shell-section">
        <label class="compact-label" for="plan-day">Day</label>
        <input type="date" id="plan-day" class="inline-date" />
      </div>
      <div class="shell-section goal-section">
        <div class="goal-section-head">
          <div><p class="shell-section-head">Today's wins</p><p class="sub">Keep it concrete. Three clear wins is usually enough.</p></div>
          <button type="button" class="ghost compact-add" id="add-goal">+ Goal</button>
        </div>
        <div class="preset-chips" id="goal-presets" aria-label="Goal suggestions"></div>
        <div id="goals" class="goal-list"></div>
      </div>
      <div class="shell-section">
        <p class="shell-section-head">Time blocks</p>
        <p class="sub" style="margin:0 0 0.45rem">Give each win a place in the day. You can add more later.</p>
        <div id="blocks"></div>
      </div>
      <div class="plan-actions">
        <button type="button" class="ghost" id="add-block">+ Block</button>
        <button type="button" id="lock">Lock plan</button>
      </div>
      <p class="miss" id="err"></p>
    </div>
  </div>
  <script src="/static/summary.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/clock.js"></script>
  <script>
    let today = "";
    let academics = { presets: [] };
    function goalEl(value) {
      const row = document.createElement("div");
      row.className = "goal-row";
      row.innerHTML = `<span class="goal-number" aria-hidden="true"></span><input class="goal-input" placeholder="e.g. Submit two applications" value="${(value || "").replace(/&/g, "&amp;").replace(/\"/g, "&quot;")}" /><button type="button" class="goal-remove ghost" aria-label="Remove goal">×</button>`;
      row.querySelector(".goal-remove").onclick = () => { row.remove(); numberGoals(); };
      return row;
    }
    function numberGoals() {
      [...el("goals").children].forEach((row, i) => { row.querySelector(".goal-number").textContent = i + 1; });
    }
    function addGoal(value, focus) {
      const row = goalEl(value);
      el("goals").appendChild(row);
      numberGoals();
      if (focus) row.querySelector("input").focus();
    }
    function blockEl(start, end, task) {
      const wrap = document.createElement("div");
      wrap.className = "gate-block-row";
      wrap.innerHTML = `<label><span>Start</span><input type="time" class="block-time start" value="${start || "09:00"}" /></label><label><span>End</span><input type="time" class="block-time end" value="${end || "10:00"}" /></label><label class="block-task"><span>Focus</span><input class="task" placeholder="What you'll do" value="${(task || "").replace(/"/g, "&quot;")}" /></label><button type="button" class="goal-remove ghost" aria-label="Remove time block">×</button>`;
      wrap.querySelector("button").onclick = () => wrap.remove();
      return wrap;
    }
    function addBlock(start, end, task) {
      el("blocks").appendChild(blockEl(start, end, task));
    }
    async function loadDay(day) {
      const p = await api("/api/plan?day=" + encodeURIComponent(day));
      el("goals").innerHTML = "";
      const goals = String(p.outcomes || "").split("\n").map((g) => g.replace(/^\s*(?:[-•]|\d+[.)])\s*/, "").trim()).filter(Boolean);
      (goals.length ? goals : [""]).forEach((g) => addGoal(g));
      el("blocks").innerHTML = "";
      const tl = p.timeline || [];
      if (tl.length) tl.forEach((b) => addBlock(b.start, b.end, b.task));
      else addBlock("09:00", "10:00", "");
    }
    el("add-block").onclick = () => addBlock("09:00", "10:00", "");
    el("add-goal").onclick = () => addGoal("", true);
    el("goal-presets").onclick = (event) => {
      const button = event.target.closest("[data-preset]");
      if (button) addGoal(button.dataset.preset, true);
    };
    el("plan-day").onchange = () => loadDay(el("plan-day").value);
    el("lock").onclick = async () => {
      el("err").textContent = "";
      const day = el("plan-day").value;
      const outcomes = [...document.querySelectorAll(".goal-input")].map((input) => input.value.trim()).filter(Boolean).join("\n");
      const timeline = [...el("blocks").children].map((row) => ({
        start: row.querySelector(".start").value,
        end: row.querySelector(".end").value,
        task: row.querySelector(".task").value,
      })).filter((b) => b.task.trim());
      try {
        await api("/api/plan", { method: "POST", body: JSON.stringify({ outcomes, timeline, day }) });
        if (day === today) location.href = "/";
        else el("err").textContent = "Saved for " + day + ". Today still needs a plan before the desk unlocks.";
        if (window.UI) UI.toast("Plan saved for " + day + ".", "mint");
      } catch (e) {
        el("err").textContent = e.message;
      }
    };
    (async () => {
      const t = await api("/api/today");
      if (t.halt) { location.href = "/halt"; return; }
      if (t.needs_recap) { location.href = "/recap"; return; }
      today = t.day;
      el("plan-day").value = t.day;
      el("plan-day").min = t.day;
      await loadDay(t.day);
      try {
        academics = await api("/api/academics/current");
        el("goal-presets").innerHTML = (academics.presets || []).map((preset) => `<button type="button" class="preset-chip" data-preset="${String(preset).replace(/&/g, "&amp;").replace(/\"/g, "&quot;")}">${String(preset).replace(/&/g, "&amp;").replace(/</g, "&lt;")}</button>`).join("");
      } catch (_) {}
    })().catch((err) => { el("err").textContent = err.message; });
  </script>
</body>
</html>
