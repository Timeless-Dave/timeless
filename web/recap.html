<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless recap</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="recap-stage">
    <div class="recap-ticket card" id="card">
      <div class="recap-dots" id="dots"></div>
      <h1 class="recap-title" id="title">Loading</h1>
      <div class="recap-stat" id="stat">Pending</div>
      <div class="stat-label" id="stat-label"></div>
      <div class="recap-bar"></div>
      <p class="recap-body" id="body">Pulling the day, including the phone if it will answer.</p>
      <div id="extra"></div>
      <div class="nav-row" id="nav" hidden>
        <button type="button" class="ghost" id="prev">Prev</button>
        <button type="button" id="go">Next</button>
      </div>
    </div>
  </div>
  <script src="/static/summary.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
  <script>
    let cards = [];
    let i = 0;
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function barRow(label, n, max) {
      const pct = max ? Math.max(6, Math.round((n / max) * 100)) : 6;
      return `<div class="compare-row"><span>${esc(label)}</span><div class="compare-track"><i class="compare-fill" style="width:${pct}%"></i></div><b>${n}</b></div>`;
    }
    function paint() {
      const c = cards[i] || {};
      el("title").textContent = c.title || "";
      el("stat").textContent = c.stat || "Pending";
      el("stat-label").textContent = c.stat_label || "";
      el("body").textContent = c.body || "";
      const extra = el("extra");
      extra.innerHTML = "";
      if (c.kind === "compare" && c.compare) {
        const max = Math.max(c.compare.blocks, c.compare.events, 1);
        extra.innerHTML = `<div class="compare-bars">
          ${barRow("Planned", c.compare.blocks, max)}
          ${barRow("Showed up", c.compare.events, max)}
        </div>
        <p class="recap-body">Last seven days (notes logged)</p>
        <div class="week-bars">` +
          (c.compare.week || []).map((d) => {
            const h = Math.max(4, Math.round((d.events / Math.max(...c.compare.week.map((x) => x.events), 1)) * 72));
            const label = (d.day || "").slice(5);
            return `<div class="week-col" title="${esc(d.day)}"><i style="height:${h}px"></i><b>${esc(label)}</b></div>`;
          }).join("") + `</div>`;
      } else if ((c.lines || []).length) {
        extra.innerHTML = `<ul class="recap-lines">${c.lines.map((line) => `<li>${esc(line)}</li>`).join("")}</ul>`;
      }
      el("go").textContent = i >= cards.length - 1 ? "I saw this" : "Next";
      el("prev").disabled = i <= 0;
      el("dots").innerHTML = cards.map((_, n) => `<i class="${n===i?"on":""}"></i>`).join("");
      el("nav").hidden = !cards.length;
    }
    function phoneStep() {
      el("dots").innerHTML = "";
      el("title").textContent = "Reconnect";
      el("stat").textContent = "ADB";
      el("stat-label").textContent = "";
      el("body").textContent = "Wireless if this Mac is on the phone hotspot (or the saved Wi-Fi IP). USB if the cable is plugged in. Skip uses Mac data only.";
      el("nav").hidden = true;
      el("extra").innerHTML = "";
      let actions = document.getElementById("phone-actions");
      if (!actions) {
        actions = document.createElement("div");
        actions.id = "phone-actions";
        actions.className = "plan-actions";
        actions.innerHTML = `<button type="button" id="ph-w">Wireless</button>
          <button type="button" id="ph-u">USB</button>
          <button type="button" id="ph-s" class="ghost">Skip</button>
          <p id="ph-msg" class="sub" style="margin-top:0.55rem;width:100%"></p>`;
        el("card").appendChild(actions);
        const msg = () => document.getElementById("ph-msg");
        const run = async (body) => {
          msg().textContent = "Working…";
          const r = await api("/api/recap/generate", { method: "POST", body: JSON.stringify(body) });
          msg().textContent = (r.phone && r.phone.detail) || (r.phone_synced ? "Phone synced." : "Mac-only recap.");
          cards = r.cards || [];
          i = 0;
          actions.remove();
          paint();
        };
        document.getElementById("ph-w").onclick = () => run({ skip_phone: false, mode: "wireless" });
        document.getElementById("ph-u").onclick = () => run({ skip_phone: false, mode: "usb" });
        document.getElementById("ph-s").onclick = () => run({ skip_phone: true });
      }
    }
    el("go").onclick = async () => {
      if (i >= cards.length - 1) {
        await api("/api/recap/ack", { method: "POST" });
        location.href = "/";
        return;
      }
      i += 1;
      paint();
    };
    el("prev").onclick = () => {
      if (i > 0) { i -= 1; paint(); }
    };
    (async () => {
      const t = await api("/api/today");
      if (t.halt) { location.href = "/halt"; return; }
      if (!t.needs_recap) { location.href = t.needs_gate ? "/gate" : "/"; return; }
      const existing = t.recap && t.recap.cards;
      if (existing && existing.length && t.recap.phone_synced) {
        cards = existing;
        paint();
        return;
      }
      phoneStep();
    })().catch((err) => { el("body").textContent = err.message; });
  </script>
</body>
</html>
